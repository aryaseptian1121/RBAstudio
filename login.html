<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — RBA Studio Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(74, 108, 247, 0.28), transparent 28%),
        linear-gradient(180deg, #0b1120, #0f172a 56%, #111827);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    }

    .login-video-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .login-video-layer video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.28;
      filter: brightness(0.7) saturate(1.2);
      pointer-events: none;
    }

    .login-video-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(11, 17, 32, 0.92) 0%, rgba(15, 23, 42, 0.8) 55%, rgba(11, 17, 32, 0.94) 100%);
      pointer-events: none;
    }

    .login-container {
      position: relative;
      z-index: 1;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(12px);
    }
    
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-badge {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 8px 0;
    }

    .logo-badge img {
      width: min(240px, 100%);
      height: auto;
      display: block;
    }
    
    .logo p {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 2px;
      letter-spacing: 0.04em;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    
    .form-group input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #f1f5f9;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    
    .form-group input:focus {
      border-color: #3b82f6;
      background: rgba(59,130,246,0.1);
    }
    
    .form-group input::placeholder {
      color: #475569;
    }
    
    .login-btn {
      width: 100%;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    
    .login-btn:hover {
      background: #2563eb;
    }
    
    .login-btn:active {
      transform: scale(0.98);
    }
    
    .login-btn:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    
    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #f87171;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 20px;
      display: none;
    }
    
    .error-msg.show {
      display: block;
      animation: shake 0.5s ease-in-out;
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    
    .hint {
      text-align: center;
      margin-top: 24px;
      color: #475569;
      font-size: 11px;
    }
    
    .hint code {
      background: rgba(255,255,255,0.05);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="login-video-layer" aria-hidden="true">
    <video autoplay loop muted playsinline preload="auto">
      <source src="assets/video/video_login.mp4" type="video/mp4">
    </video>
    <div class="login-video-overlay"></div>
  </div>

  <div class="login-container">
    <div class="logo">
      <div class="logo-badge">
        <img src="RBA_logo.png" alt="RBA Studio Pro">
      </div>
      <p>Workflow Automation Designer</p>
    </div>
    
    <div class="error-msg" id="error-msg"></div>
    
    <div id="login-form" style="display: flex; flex-direction: column; gap: 20px;">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Masukkan username" autocomplete="username">
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password">
      </div>
      
      <button type="button" class="login-btn" id="login-btn">LOGIN</button>
    </div>
    
    <div class="hint" id="default-users">
      Memuat default user...
    </div>
  </div>
  
  <script>
    // Wait for electronAPI to be available (set by preload.js)
    // With some timeout fallback
    let apiReady = false;

    function waitForAPI(timeout = 3000) {
      return new Promise((resolve) => {
        const checkInterval = setInterval(() => {
          if (window.electronAPI) {
            clearInterval(checkInterval);
            apiReady = true;
            resolve(true);
          }
        }, 50);
        
        setTimeout(() => {
          clearInterval(checkInterval);
          if (!apiReady) {
            console.warn('[Login] electronAPI not available after timeout');
            resolve(false);
          }
        }, timeout);
      });
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', async () => {
      await waitForAPI();
      await loadDefaultUsers();
      if (!apiReady) {
        const errorEl = document.getElementById('error-msg');
        if (errorEl) {
          errorEl.textContent = 'Aplikasi tidak siap, menggunakan fallback login lokal.';
          errorEl.classList.add('show');
        }
      }
    });

    const form = document.getElementById('login-form');
    const btn = document.getElementById('login-btn');
    const errorEl = document.getElementById('error-msg');
    const defaultUsersEl = document.getElementById('default-users');

    function renderDefaultUsers(users) {
      if (!defaultUsersEl) return;
      if (!users || users.length === 0) {
        defaultUsersEl.textContent = 'Tidak ada default user yang tersedia.';
        return;
      }

      defaultUsersEl.innerHTML = 'Default users:';
      const list = document.createElement('div');
      list.style.display = 'grid';
      list.style.gridTemplateColumns = '1fr 1fr';
      list.style.gap = '10px';
      list.style.marginTop = '12px';

      users.forEach((user) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.textContent = `${user.username} / ${user.password}`;
        item.style.border = '1px solid rgba(255,255,255,0.12)';
        item.style.background = 'transparent';
        item.style.color = '#cbd5e1';
        item.style.borderRadius = '8px';
        item.style.padding = '10px';
        item.style.cursor = 'pointer';
        item.style.textAlign = 'left';
        item.addEventListener('click', () => {
          document.getElementById('username').value = user.username;
          document.getElementById('password').value = user.password;
          errorEl.textContent = '';
          errorEl.classList.remove('show');
        });
        list.appendChild(item);
      });

      defaultUsersEl.appendChild(list);
    }

    async function loadDefaultUsers() {
      const fallbackUsers = [
        { username: 'admin', password: 'admin123' },
        { username: 'arya', password: 'aryaseptian' }
      ];

      const timeout = setTimeout(() => {
        renderDefaultUsers(fallbackUsers);
      }, 2000);

      if (!window.electronAPI?.invoke) {
        clearTimeout(timeout);
        renderDefaultUsers(fallbackUsers);
        return;
      }

      try {
        const users = await window.electronAPI.invoke('get-default-users');
        clearTimeout(timeout);
        renderDefaultUsers(Array.isArray(users) ? users : fallbackUsers);
      } catch (err) {
        clearTimeout(timeout);
        console.warn('[Login] Failed to load default users:', err);
        renderDefaultUsers(fallbackUsers);
      }
    }

    async function handleLogin(event) {
      // Prevent default form submission if called from form
      if (event && event.preventDefault) event.preventDefault();

      // Get input values
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      // Validate
      if (!username || !password) {
        if (errorEl) {
          errorEl.textContent = 'Username dan password wajib diisi';
          errorEl.classList.add('show');
        }
        return;
      }

      // Clear error
      if (errorEl) {
        errorEl.textContent = '';
        errorEl.classList.remove('show');
      }

      // Disable button
      btn.disabled    = true;
      btn.textContent = 'Memverifikasi...';

      try {
        if (window.electronAPI?.invoke) {
          const result = await Promise.race([
            window.electronAPI.invoke('login', { username, password }),
            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000))
          ]);

          if (result?.ok || result?.success) {
            btn.textContent = '✓ Berhasil! Membuka aplikasi...';
            btn.style.background = '#10b981';
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 500);
            return;
          }

          btn.disabled = false;
          btn.textContent = 'LOGIN';
          if (errorEl) {
            errorEl.textContent = result?.message || result?.reason || 'Username atau password salah';
            errorEl.classList.add('show');
          }
          form.style.animation = 'shake 0.4s ease';
          setTimeout(() => form.style.animation = '', 500);
          return;
        }
      } catch (err) {
        if (err.message !== 'timeout') {
          btn.disabled = false;
          btn.textContent = 'LOGIN';
          if (errorEl) {
            errorEl.textContent = 'Error: ' + err.message;
            errorEl.classList.add('show');
          }
          console.error('[Login] IPC error:', err);
          return;
        }
        // Timeout => fallback to local check
      }

      const validUsers = [
        { username: 'admin', password: 'admin123', role: 'admin' },
        { username: 'arya', password: 'aryaseptian', role: 'admin' },
      ];
      const found = validUsers.find(x => x.username === username && x.password === password);
      if (found) {
        btn.textContent = '✓ Berhasil! Membuka aplikasi...';
        btn.style.background = '#10b981';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
        return;
      }

      btn.disabled = false;
      btn.textContent = 'LOGIN';
      if (errorEl) {
        errorEl.textContent = 'Username atau password salah';
        errorEl.classList.add('show');
      }
      form.style.animation = 'shake 0.4s ease';
      setTimeout(() => form.style.animation = '', 500);
    }

    // Attach click handler to button
    btn.addEventListener('click', handleLogin);

    // Also allow Enter key in password field
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleLogin();
      }
    });

    // Allow Enter key in username field
    document.getElementById('username').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('password').focus();
      }
    });
  </script>
</body>
</html>
